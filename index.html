<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeloVendo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>
    <header>
        <nav class="nav">
            <img class="nav__logo" src="assets/img/Logotipo_TeloVendo.svg" alt="Logotipo Te lo Vendo">
            <input type="checkbox" id="menu-toggle" class="nav__checkbox" />
            <label for="menu-toggle" class="nav__icono">&#9776;</label>
            <ul class="nav__menu">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="quienessomos.html">Quienes Somos</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="carousel">
                <div class="slide active">
                    <img src="assets/img/banner_1.jpg" alt="Oferta 1">
                </div>
                <div class="slide">
                    <img src="assets/img/banner_2.jpg" alt="Oferta 2">
                </div>
                <div class="slide">
                    <img src="assets/img/banner_3.jpg" alt="Oferta 3">
                </div>
                <button class="prev">⟨</button>
                <button class="next">⟩</button>
            </div>
        </section>

        <h1>Catálogo de Productos</h1>
        <section id="productos" class="grid"></section>

        <section id="carrito">
        <h2>Carrito de Compras</h2>
        <table id="tabla-carrito">
            <thead>
            <tr>
                <th>Producto</th>
                <th>Cantidad</th>
                <th>Total</th>
                <th>Acción</th>
            </tr>
            </thead>
            <tbody></tbody>
        </table>
        <div id="resumen"></div>
        </section>
        <section id="checkout">
            <h2>Datos de Despacho</h2>
            <form id="form-despacho">
                <label>Nombre de quien recibe: <input type="text" id="nombre" required></label><br>
                <label>Dirección: <input type="text" id="direccion" required></label><br>
                <label>Comuna: <input type="text" id="comuna" required></label><br>
                <label>Región: <input type="text" id="region" required></label><br>
                <label>Email: <input type="email" id="email" required></label><br><br>
                <button type="submit">Confirmar Compra</button>
            </form>

            <div id="boleta" style="display:none;">
                <h2>Boleta Electrónica</h2>
                <div id="detalle-boleta"></div>
            </div>
        </section>


    </main>
    <footer>
        <section class="footer">
            <h3>Desarrolladores:</h3>
            <div class="footer__contenido">
                <ul>
                    <li><a href="#">Camila Collado</a></li>
                    <li><a href="#">Daniel Paredes</a></li>
                    <li><a href="#">Jesús Pérez</a></li>
                </ul>

            </div>

        </section>
    </footer>

    <script src="assets/js/script.js"></script>
</body>

</html>
